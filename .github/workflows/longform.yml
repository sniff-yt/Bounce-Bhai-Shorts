name: Bounce Bhai Long Stories
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Long story {0} {1}', inputs.lang, inputs.publish && '(publish)' || '(test)') || 'Long story (scheduled)' }}

# Long-form animated moral stories (8-10 min, Telugu / Hindi / English). One public video per language per day:
#   slots te 12:30 UTC (6:00 PM IST), hi 13:30 UTC (7:00 PM IST), en 14:30 UTC (8:00 PM IST).
# GitHub drops many scheduled runs, so every scheduled run is a catch-up: it renders the FIRST language (te, hi, en
# order) whose slot has passed and that has no long_story with today's IST date in data/history.json on main
# (scripts/long_guard.py pick). Nothing due -> it exits in seconds, before any package install. Catch-up crons fire
# every 20 min from 12:45 to 18:45 UTC (6:15 PM - 00:15 IST); the :30 slot crons start each language on time.
# All scheduled runs share ONE concurrency group, so two scheduled runs never render at once (no same-language race);
# a scheduled run also stands down while an older-version scheduled run is in progress, and skips a language a manual
# publish run is rendering. make_long.sh re-checks history right before the upload, so a late duplicate never posts.
# Schedule runs always publish (after the gates in make_long.sh). Manual runs: publish=false keeps the video as an
# artifact only. A language not listed in LONG_READY is never picked by scheduled runs.
on:
  schedule:
    - cron: '30 12,13,14 * * *'      # slots: te 12:30, hi 13:30, en 14:30 UTC
    - cron: '45 12 * * *'            # catch-up
    - cron: '5,25,45 13-18 * * *'    # catch-up (every 20 min until 18:45 UTC)
  workflow_dispatch:
    inputs:
      lang:
        description: 'Story language'
        required: true
        default: 'te'
        type: choice
        options: [te, hi, en]
      publish:
        description: 'Upload to YouTube (false = artifact only)'
        required: false
        default: false
        type: boolean
      theme:
        description: 'Optional story seed / theme (empty = pick a fresh one)'
        required: false
        default: ''

concurrency:
  # scheduled + catch-up runs: one shared group; manual runs: per language. Separate from the Shorts pipeline.
  group: ${{ github.event_name == 'schedule' && 'bouncebhai-long-sched' || format('bouncebhai-long-{0}', inputs.lang) }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read     # the catch-up picker lists running runs of this workflow
  models: read      # unused since GitHub Models was retired (2026-07-30); harmless

jobs:
  long:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      BB_LONG_SEED_THEME: ${{ inputs.theme }}
      BB_X264: veryfast
      LONG_PUBLISH: ${{ (github.event_name == 'schedule' || inputs.publish) && 'publish' || '' }}
      LONG_READY: 'te,hi,en'   # languages whose scheduled runs may post; remove one to pause it
    steps:
      - uses: actions/checkout@v4

      - name: Daily guard / pick the language
        id: guard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_LANG: ${{ inputs.lang }}
        run: |
          echo "event=${{ github.event_name }} cron='${{ github.event.schedule }}' publish=${LONG_PUBLISH:-no}"
          GO=1; L="$IN_LANG"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            git fetch -q origin main && git show origin/main:data/history.json > /tmp/hist_latest.json || cp data/history.json /tmp/hist_latest.json
            L=$(python3 scripts/long_guard.py pick /tmp/hist_latest.json)
            if [ -n "$L" ] && [[ ",$LONG_READY," != *",$L,"* ]]; then
              echo "::warning title=not ready::$L long-form is paused (not in LONG_READY) - skipping"; L=""
            fi
            if [ -z "$L" ]; then echo "::notice title=catch-up::nothing to post right now - exiting"; GO=0; fi
          fi
          echo "lang=$L"
          echo "LONG_LANG=$L" >> "$GITHUB_ENV"
          echo "go=$GO" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == '1'
        with:
          python-version: "3.11"

      - name: System packages
        if: steps.guard.outputs.go == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libegl1 libfontconfig1 libx11-6 libfribidi0 libraqm0 libharfbuzz0b
          ffprobe -version | head -1
          nproc

      - name: Python packages
        if: steps.guard.outputs.go == '1'
        run: |
          pip install --progress-bar off numpy pillow requests edge-tts google-api-python-client google-auth skia-python==144.0.post2
          python -c "from PIL import features; print('raqm', features.check('raqm'))"

      - name: YouTube token check
        if: steps.guard.outputs.go == '1'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MY_VOICE_KEY: ${{ secrets.MY_VOICE_KEY }}
          YT_CHANNEL_ID: UCn8j185kE4GH44U8b6n7Qgw
        run: |
          # publish runs stop here if the token cannot upload to Bounce Bhai; test runs only warn
          python scripts/yt_scope.py || { [ "$LONG_PUBLISH" = "publish" ] && exit 1; echo "::warning title=youtube token::check failed (test run continues)"; }

      - name: Fonts (Noto Sans Telugu / Devanagari)
        if: steps.guard.outputs.go == '1'
        run: |
          mkdir -p assets/fonts
          for f in NotoSansTelugu/hinted/ttf/NotoSansTelugu-Bold.ttf NotoSansTelugu/hinted/ttf/NotoSansTelugu-Black.ttf \
                   NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Bold.ttf NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Black.ttf \
                   NotoSans/hinted/ttf/NotoSans-Bold.ttf NotoSans/hinted/ttf/NotoSans-Black.ttf; do
            b=$(basename "$f"); [ -s "assets/fonts/$b" ] || curl -sfL -o "assets/fonts/$b" "https://github.com/notofonts/notofonts.github.io/raw/main/fonts/$f"
          done
          ls -la assets/fonts

      - name: Make the episode (story, voices, music, thumbnail, animation)
        if: steps.guard.outputs.go == '1'
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MY_VOICE_KEY: ${{ secrets.MY_VOICE_KEY }}
          YT_PRIVACY: public
          YT_CHANNEL_ID: UCn8j185kE4GH44U8b6n7Qgw   # Bounce Bhai (@bouncebhaiofficial): refuse to post anywhere else
        run: |
          START=$(date +%s)
          bash scripts/make_long.sh "$LONG_LANG" "$LONG_PUBLISH"
          echo "::notice title=total::$(( ($(date +%s) - START) / 60 )) min end to end"

      - name: Save the episode
        if: always() && steps.guard.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME || 'long_story' }}
          path: |
            out/*.mp4
            out/*_thumb.jpg
            out/long_*.json
            out/*_speech.wav
          retention-days: 14

      - name: Remember what was posted
        if: success() && steps.guard.outputs.go == '1' && env.LONG_PUBLISH == 'publish'
        run: |
          git config user.name "bouncebhai-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 scripts/push_log.py "log: $NAME" data/history.json data/long_topics.json
