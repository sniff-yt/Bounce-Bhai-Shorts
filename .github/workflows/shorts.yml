name: Bounce Bhai Shorts

on:
  schedule:
    # GitHub silently drops many scheduled runs, so wake 3x an hour; the gate posts at most once per ~50 min,
    # and only in the IST hours listed in data/schedule.json.
    - cron: "10 * * * *"
    - cron: "30 * * * *"
    - cron: "50 * * * *"
  workflow_dispatch:
    inputs:
      format:
        description: 'Force a format (race, sim, promo); empty = auto'
        required: false
        default: ''

concurrency:
  group: bouncebhai-shorts
  cancel-in-progress: false

permissions:
  contents: write
  models: read
  actions: write   # guard.py pauses auto-posting after 2 failed runs in a row

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/schedule.json
            data/history.json
          sparse-checkout-cone-mode: false
      - id: g
        run: |
          H=$(TZ=Asia/Kolkata date +%-H)
          if [ "${{ github.event_name }}" != "schedule" ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! python3 -c "
          import json, datetime as d
          try:
              h = [x for x in json.load(open('data/history.json')) if x.get('video_id')]
              age = (d.datetime.now(d.timezone.utc) - d.datetime.fromisoformat(h[-1]['date'])).total_seconds() / 60
          except Exception:
              age = 1e9
          print(f'last post {age:.0f} min ago'); raise SystemExit(0 if age >= 50 else 1)"; then
            echo "Posted recently, skipping"; echo go=false >> "$GITHUB_OUTPUT"; exit 0
          fi
          if python3 -c "import json,sys;h=json.load(open('data/schedule.json')).get('hours_ist',[]);sys.exit(0 if int(sys.argv[1]) in h else 1)" "$H"; then
            echo go=true >> "$GITHUB_OUTPUT"
          else
            echo "Not a posting hour ($H IST)"; echo go=false >> "$GITHUB_OUTPUT"
          fi

  short:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash   # -eo pipefail, so "cmd | live.py tee" still fails when cmd fails
    env:
      BB_FORMAT: ${{ inputs.format }}
      BB_BUDGET_MIN: "45"
      NARA_MODELS: "laguna-s-2.1,nemotron-3.5-lightning-free"
    steps:
      - name: Job clock
        run: echo "BB_DEADLINE=$(( $(date +%s) + 72*60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Start the dashboard live feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf out/live
          python3 scripts/live.py stage "Starting up the studio" --pct 1
          python3 scripts/live.py set trigger=${{ github.event_name }} started=$(date +%s)
          BB_LIVE_EVERY=4 nohup bash scripts/live_push.sh loop >/dev/null 2>&1 &

      - name: Start the studio desktop (optional, off by default - it cost ~4 min per run)
        if: vars.BB_DESKTOP == '1'
        run: bash scripts/desktop.sh || true

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # Plain apt install on purpose: caching apt packages breaks ffmpeg (libblas.so.3 missing).
      - name: System packages
        run: |
          {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core libgl1 libegl1 libfontconfig1 libx11-6
            ffprobe -version | head -1
          } 2>&1 | python3 scripts/live.py tee "apt-get install ffmpeg"

      - name: Python packages (race / ball-escape / promo only need these)
        run: |
          pip install --progress-bar off numpy pillow requests google-api-python-client google-auth skia-python==144.0.post2 \
            2>&1 | python3 scripts/live.py tee "pip install skia + YouTube client"

      - name: Plan the Short
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/make_short.sh prepare 2>&1 | python3 scripts/live.py tee "make_short.sh prepare (pick format + plan)"

      - name: Animate and post the Short
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_PRIVACY: public
          MY_VOICE_KEY: ${{ secrets.MY_VOICE_KEY }}
          YT_CHANNEL_ID: UCn8j185kE4GH44U8b6n7Qgw   # Bounce Bhai (@bouncebhaiofficial): refuse to post anywhere else
        run: bash scripts/make_short.sh publish 2>&1 | python3 scripts/live.py tee "make_short.sh publish (animate + upload)"

      - name: Save the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME || 'short' }}
          path: |
            out/*_final.mp4
            out/*.srt
            out/*.json
          retention-days: 14

      - name: Finish the dashboard live feed
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pkill -f "live_push.sh loop" || true
          python3 scripts/live.py done ${{ job.status == 'success' && 'ok' || 'failed' }}
          bash scripts/live_push.sh once

      - name: Phone ping + pause guard
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            [ -n "$NAME" ] && python3 scripts/guard.py posted "out/$NAME.json" || true
          elif [ "${{ job.status }}" = "failure" ]; then
            python3 scripts/guard.py failed || true
          fi

      - name: Remember what was posted
        if: success()
        run: |
          git config user.name "bouncebhai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "log: $NAME" || exit 0
          git pull --rebase --autostash && git push
