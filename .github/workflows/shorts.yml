jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BLENDER_VERSION: "4.5.14"
      BB_BUDGET_MIN: "25"
    steps:
      - name: Job clock
        run: echo "BB_DEADLINE=$(( $(date +%s) + 44*60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libxkbcommon0 libsm6 libice6 libx11-6 libgl1 libegl1

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender (official LTS tarball)
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          base="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}"
          f="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 3 -o "/tmp/$f" "$base/$f"
          curl -fsSL --retry 3 "$base/blender-${BLENDER_VERSION}.sha256" | grep " $f" | (cd /tmp && sha256sum -c -)
          mkdir -p ~/blender && tar -xJf "/tmp/$f" -C ~/blender --strip-components=1 && rm "/tmp/$f"

      - name: Blender ready
        run: |
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
          ~/blender/blender --version | head -1

      - name: Python packages
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -r requirements.txt

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1

      - name: Unlock voice sample
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in voice/ref.wav.enc -out voice/ref.wav -pass env:VOICE_KEY
          if [ -f voice/keys.env.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in voice/keys.env.enc -pass env:VOICE_KEY > /tmp/keys.env
            while IFS='=' read -r k v; do [ -n "$k" ] && echo "::add-mask::$v" && echo "$k=$v" >> "$GITHUB_ENV"; done < /tmp/keys.env
            rm /tmp/keys.env
          fi

      - name: Make and upload the Short
        env:
          CRYSTAL_API_KEY: ${{ secrets.CRYSTAL_API_KEY || vars.CRYSTAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || env.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || env.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || env.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN || env.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: bash scripts/make_short.sh
