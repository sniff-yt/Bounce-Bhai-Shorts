name: Bounce Bhai Shorts

on:
#  schedule:
#    - cron: "5 * * * *"        # PAUSED 2026-10-19 while the new engine is built (re-enable to post hourly)
  workflow_dispatch: {}

concurrency:
  group: bouncebhai-shorts
  cancel-in-progress: false

permissions:
  contents: write
  models: read

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BLENDER_VERSION: "4.5.14"
      BB_BUDGET_MIN: "45"
      NARA_MODELS: "laguna-s-2.1,nemotron-3.5-lightning-free"
    steps:
      - name: Job clock
        run: echo "BB_DEADLINE=$(( $(date +%s) + 72*60 ))" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # Plain apt install on purpose: caching apt packages breaks ffmpeg (libblas.so.3 missing).
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core libxi6 libxxf86vm1 libxfixes3 libxrender1 \
            libxkbcommon0 libsm6 libice6 libx11-6 libgl1 libegl1
          ffprobe -version | head -1

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Install Blender (official tarball)
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          base="https://download.blender.org/release/Blender${BLENDER_VERSION%.*}"
          f="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 3 --retry-all-errors -o "/tmp/$f" "$base/$f"
          curl -fsSL --retry 3 --retry-all-errors "$base/blender-${BLENDER_VERSION}.sha256" | grep " $f" | (cd /tmp && sha256sum -c -)
          mkdir -p ~/blender && tar -xJf "/tmp/$f" -C ~/blender --strip-components=1 && rm "/tmp/$f"

      - name: Blender ready
        run: |
          echo "BLENDER=$HOME/blender/blender" >> "$GITHUB_ENV"
          ~/blender/blender --version | head -1

      - name: Cache Python packages
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-torchcpu-v1

      - name: Python packages (only on cache miss)
        if: steps.venv-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install --upgrade pip
          ~/venv/bin/pip install --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          ~/venv/bin/pip install -r requirements.txt

      - name: Use cached venv
        run: |
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          ~/venv/bin/pip install -q skia-python==144.0.post2   # 2D cartoon engine (engine/render2d.py)

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1

      - name: Unlock voice sample and encrypted keys
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
          MY_VOICE_KEY: ${{ secrets.MY_VOICE_KEY }}
        run: |
          # Your own cloned voice (voice/my_voice.wav.enc, cleaned 20 s recording) wins when MY_VOICE_KEY is set;
          # otherwise the original sample keeps working.
          if [ -n "$MY_VOICE_KEY" ] && [ -f voice/my_voice.wav.enc ] && \
             openssl enc -d -aes-256-cbc -pbkdf2 -in voice/my_voice.wav.enc -out voice/ref.wav -pass env:MY_VOICE_KEY; then
            echo "voice: using my_voice.wav"
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -in voice/ref.wav.enc -out voice/ref.wav -pass env:VOICE_KEY
            echo "voice: using ref.wav (set MY_VOICE_KEY to use your own recording)"
          fi
          if [ -f voice/keys.env.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in voice/keys.env.enc -pass env:VOICE_KEY > /tmp/keys.env
            while IFS='=' read -r k v; do
              [ -n "$k" ] || continue
              echo "::add-mask::$v"
              echo "$k=$v" >> "$GITHUB_ENV"
            done < /tmp/keys.env
            rm -f /tmp/keys.env
          fi

      - name: Setup the models in Blender
        env:
          SKETCHFAB_TOKEB: ${{ secrets.SKETCHFAB_TOKEB }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/make_short.sh prepare

      - name: Animate and post the Short
        env:
          SKETCHFAB_TOKEB: ${{ secrets.SKETCHFAB_TOKEB }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_PRIVACY: public
        run: bash scripts/make_short.sh publish

      - name: Save the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME || 'short' }}
          path: |
            out/*_final.mp4
            out/*.srt
            out/*.json
          retention-days: 14

      - name: Remember the story (no repeats)
        if: success()
        run: |
          git config user.name "bouncebhai-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "log: $NAME" || exit 0
          git pull --rebase --autostash && git push
