name: Dashboard stats

# Real subscriber / view counts for the web dashboard, kept on the orphan `data` branch (stats.json).
on:
  schedule:
    - cron: "35 * * * *"
  workflow_run:
    workflows: ["Bounce Bhai Shorts", "Post my video"]
    types: [completed]
  workflow_dispatch: {}

concurrency:
  group: bouncebhai-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q google-api-python-client google-auth
      - name: Read channel numbers
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          MY_VOICE_KEY: ${{ secrets.MY_VOICE_KEY }}
        run: |
          mkdir -p /tmp/data
          git fetch -q origin data 2>/dev/null && git show origin/data:stats.json > /tmp/data/stats.json 2>/dev/null || true
          cd scripts && python stats.py /tmp/data/stats.json
      - name: Publish to the data branch
        run: |
          cd /tmp/data && git init -q -b data
          git -c user.name=bouncebhai-bot -c user.email=bot@users.noreply.github.com add stats.json
          git -c user.name=bouncebhai-bot -c user.email=bot@users.noreply.github.com commit -qm "stats $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
